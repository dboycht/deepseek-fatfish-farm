appId: com.dboycht.fatfishfarm
productName: FatFishFarm
copyright: Copyright © 2026 dboycht
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: plugins
    to: plugins
  - from: resources/art/LICENSE.txt
    to: art/LICENSE.txt
  - from: resources/art/LICENSE-ASSET.md
    to: art/LICENSE-ASSET.md
asar: true
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: deepseek-fatfish-farm-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 肥鱼养殖场
  deleteAppDataOnUninstall: false
  artifactName: deepseek-fatfish-farm-${version}-setup.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
mac:
  icon: build/icon.png
